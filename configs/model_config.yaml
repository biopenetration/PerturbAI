split:
  test_frac: 0.2
  seeds: [0, 1, 2, 3, 4]
features:
  coexpr_components: 64
  graph_knn: 15
  graph_steps: 2
  graph_alpha: 0.5
models:
  ridge: {alpha: 10.0}
  knn: {k: 5}
  rf: {n_estimators: 200, n_pca_targets: 50, min_samples_leaf: 2}
  mlp: {hidden: [512, 512], dropout: 0.1, lr: 0.001, weight_decay: 0.0001, epochs: 300, batch_size: 64, patience: 25}
metrics:
  top_k: 20
